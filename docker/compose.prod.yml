# Production overlay: HTTPS in front of the stack, nothing else exposed.
#   docker compose -f compose.yml -f compose.prod.yml up -d
# Needs DOMAIN in docker/.env (e.g. mill.atulyaa.in) pointing at this server.
services:
  frontend:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in docker/.env}
      # Public landing page (site/atulyaa); its DNS A record points at this same server.
      LANDING_DOMAIN: ${LANDING_DOMAIN:-atulyaa.astrasunglobal.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site/atulyaa:/srv/landing:ro
    depends_on:
      - frontend

volumes:
  caddy-data:
