# Public entry point: a Network Load Balancer in front of nginx, TLS ended with an ACM certificate.
# Needs no extra controller: the in-tree AWS provider creates it. Point your domain's CNAME at its hostname.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: astrasun
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "${CERT_ARN}"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector: {app: frontend}
  ports:
    - {name: https, port: 443, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: astrasun}
spec:
  selector: {app: backend}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: v1
kind: Service
metadata: {name: websocket, namespace: astrasun}
spec:
  selector: {app: websocket}
  ports: [{port: 9000, targetPort: 9000}]
