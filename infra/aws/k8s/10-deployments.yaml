apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: astrasun
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: scheduler}
  template:
    metadata:
      labels: {app: scheduler}
    spec:
      securityContext: {fsGroup: 1000}
      containers:
        - name: scheduler
          image: ${IMAGE}
          command: ["bench","schedule"]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
          volumeMounts:
            - {name: sites, mountPath: /home/frappe/frappe-bench/sites}
            - {name: logs, mountPath: /home/frappe/frappe-bench/logs}
      volumes:
        - name: sites
          persistentVolumeClaim: {claimName: astrasun-sites}
        - name: logs
          emptyDir: {}
