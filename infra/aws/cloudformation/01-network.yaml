AWSTemplateFormatVersion: "2010-09-09"
Description: Atulyaa mill - network (VPC, two public and two private subnets, one NAT gateway)

Parameters:
  EnvName:
    Type: String
    Default: mill
    Description: Short name used in resource names and as the EKS cluster name
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "${EnvName}-vpc" }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "${EnvName}-igw" }

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 12]]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${EnvName}-public-a" }
        - { Key: kubernetes.io/role/elb, Value: "1" }
        - { Key: !Sub "kubernetes.io/cluster/${EnvName}", Value: shared }

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 12]]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${EnvName}-public-b" }
        - { Key: kubernetes.io/role/elb, Value: "1" }
        - { Key: !Sub "kubernetes.io/cluster/${EnvName}", Value: shared }

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 12]]
      Tags:
        - { Key: Name, Value: !Sub "${EnvName}-private-a" }
        - { Key: kubernetes.io/role/internal-elb, Value: "1" }
        - { Key: !Sub "kubernetes.io/cluster/${EnvName}", Value: shared }

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 12]]
      Tags:
        - { Key: Name, Value: !Sub "${EnvName}-private-b" }
        - { Key: kubernetes.io/role/internal-elb, Value: "1" }
        - { Key: !Sub "kubernetes.io/cluster/${EnvName}", Value: shared }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${EnvName}-public" }

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - { Key: Name, Value: !Sub "${EnvName}-nat" }

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${EnvName}-private" }

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "${EnvName}-VpcId" }
  VpcCidr:
    Value: !Ref VpcCidr
    Export: { Name: !Sub "${EnvName}-VpcCidr" }
  PublicSubnets:
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export: { Name: !Sub "${EnvName}-PublicSubnets" }
  PrivateSubnets:
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
    Export: { Name: !Sub "${EnvName}-PrivateSubnets" }
  PrivateSubnetA:
    Value: !Ref PrivateSubnetA
    Export: { Name: !Sub "${EnvName}-PrivateSubnetA" }
  PrivateSubnetB:
    Value: !Ref PrivateSubnetB
    Export: { Name: !Sub "${EnvName}-PrivateSubnetB" }
