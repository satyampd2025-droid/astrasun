# Rehearsal on a throwaway copy of the server stack (same image as the server: ERPNext v15 + India
# Compliance + astrasun): send the order the phone sends ("Send for approval") as the different kinds
# of user, and print the server's own answer. Nothing here touches the live test server. Runs when
# the files below change on the test branch, or by hand from the Actions tab.
name: Diagnose order

on:
  push:
    branches: [claude/project-thread-z9q9jp]
    paths:
      - ".github/workflows/diagnose-order.yml"
      - ".github/diagnose/order_rehearsal.py"
      - ".github/diagnose/dues_check.py"
      - ".github/diagnose/stack.sh"
      - "docker/try-order.sh"
      - "docker/try_order.py"
  workflow_dispatch:

concurrency:
  group: diagnose-order
  cancel-in-progress: true

env:
  ADMIN_PASSWORD: ci-admin-pass-1

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build the image (same as the server)
        run: docker build -f docker/Dockerfile -t astrasun:dev .

      - name: Start the stack and finish the setup wizard with the real site's answers
        run: |
          .github/diagnose/stack.sh up
          .github/diagnose/stack.sh wizard

      - name: Send the order as each kind of user
        run: |
          .github/diagnose/stack.sh in -e ADMIN_PASSWORD backend \
            bash -c 'cd /home/frappe/frappe-bench/sites && ../env/bin/python -' \
            < .github/diagnose/order_rehearsal.py 2>&1 | tee order-rehearsal.txt

      # docker/try-order.sh is what the server owner runs on the live server; prove it on the copy.
      # The rehearsal above leaves the company registered, with an address that carries a GSTIN.
      - name: try-order.sh with that address in place (every user should get OK)
        run: |
          echo "DOMAIN=ci.localhost" >> docker/.env
          bash docker/try-order.sh 2>&1 | tee try-order-1.txt
          grep -q "OK. It would be saved" try-order-1.txt
          ! grep -q REFUSED try-order-1.txt

      - name: try-order.sh with the company address switched off (should name the missing address)
        run: |
          .github/diagnose/stack.sh in backend bash -c 'cd sites && ../env/bin/python -' <<'EOF'
          import frappe
          frappe.init(site="mill.localhost", sites_path=".")
          frappe.connect()
          frappe.db.sql("update tabAddress set disabled = 1 where is_your_company_address = 1")
          frappe.db.commit()
          frappe.clear_cache()
          EOF
          bash docker/try-order.sh 2>&1 | tee try-order-2.txt
          grep -q "REFUSED (MandatoryError): Please set Company Address Name" try-order-2.txt

      - name: try-order.sh once the company is Unregistered again (every user should get OK)
        run: |
          .github/diagnose/stack.sh in backend bash -c 'cd sites && ../env/bin/python -' <<'EOF'
          import frappe
          frappe.init(site="mill.localhost", sites_path=".")
          frappe.connect()
          frappe.db.set_value("Company", "Astrasun Global LLP", "gst_category", "Unregistered")
          frappe.db.commit()
          frappe.clear_cache()
          EOF
          bash docker/try-order.sh "Gautam kumar singh" 2>&1 | tee try-order-3.txt
          grep -q "OK. It would be saved" try-order-3.txt
          ! grep -q REFUSED try-order-3.txt
          # nothing may have been kept: the orders in the database are still the nine the rehearsal made
          .github/diagnose/stack.sh in backend bash -c 'cd sites && ../env/bin/python -' <<'EOF'
          import frappe
          frappe.init(site="mill.localhost", sites_path=".")
          frappe.connect()
          n = frappe.db.count("Sales Order")
          print("Sales Orders in the database:", n)
          assert n == 9, n
          EOF

      # What the live server showed: an account with the Mill Sales job but without the Sales User role
      # ("does not have doctype access via role permission for document Sales Order").
      - name: Account with a mill job but not its standard roles (refused, then repaired the way a migrate does)
        run: |
          .github/diagnose/stack.sh in backend bash -c 'cd sites && ../env/bin/python -' <<'EOF'
          import frappe
          frappe.init(site="mill.localhost", sites_path=".")
          frappe.connect()
          frappe.set_user("Administrator")
          email = "ticked-only@example.com"
          user = frappe.get_doc({"doctype": "User", "email": email, "first_name": "ticked", "send_welcome_email": 0})
          user.append("roles", {"role": "Mill Sales"})
          user.insert()
          print("Saved with only Mill Sales ticked, the account holds:", sorted(r.role for r in user.roles))
          assert "Sales User" in {r.role for r in user.roles}, "the standard role was not added on save"
          # make it look like an account made before this change: take the standard role away behind the app's back
          frappe.db.delete("Has Role", {"parent": email, "role": "Sales User"})
          frappe.db.commit()
          frappe.clear_cache(user=email)
          EOF
          bash docker/try-order.sh 2>&1 | tee try-order-4.txt
          grep -A1 "As ticked-only@example.com" try-order-4.txt | grep -q "does not have doctype access via role permission for document Sales Order"
          .github/diagnose/stack.sh in backend bash -c 'cd sites && ../env/bin/python -' <<'EOF'
          import frappe
          frappe.init(site="mill.localhost", sites_path=".")
          frappe.connect()
          frappe.set_user("Administrator")
          from astrasun.setup.roles import sync_users
          sync_users()
          frappe.db.commit()
          EOF
          bash docker/try-order.sh 2>&1 | tee try-order-5.txt
          grep -A1 "As ticked-only@example.com" try-order-5.txt | grep -q "OK. It would be saved"
          ! grep -q REFUSED try-order-5.txt

      # Customer dues as the phone asks for them: a sales rep may look but not receive money.
      - name: Customer dues over HTTP as a sales rep, the owner and a warehouse user
        run: |
          .github/diagnose/stack.sh in backend bash -c 'cd /home/frappe/frappe-bench/sites && ../env/bin/python -' \
            < .github/diagnose/dues_check.py 2>&1 | tee dues-check.txt
          ! grep -q FAIL dues-check.txt
          grep -c "OK  " dues-check.txt | grep -q 4

      # The app's own tests for the same thing. Last, because ERPNext's test setup changes site defaults.
      - name: The app's role tests
        continue-on-error: true
        run: |
          .github/diagnose/stack.sh in backend bench --site mill.localhost set-config -p allow_tests True
          .github/diagnose/stack.sh in backend timeout 900 bench --site mill.localhost run-tests --module astrasun.tests.test_setup 2>&1 | tee role-tests.txt
          ! grep -qE "^(FAILED|ERROR)|Traceback" role-tests.txt

      - name: The app's delivery and payment tests (dues for a rep)
        continue-on-error: true
        run: |
          .github/diagnose/stack.sh in backend timeout 1200 bench --site mill.localhost run-tests --module astrasun.tests.test_delivery_payments 2>&1 | tee payment-tests.txt
          ! grep -qE "^(FAILED|ERROR)|Traceback" payment-tests.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-rehearsal
          path: |
            order-rehearsal.txt
            try-order-*.txt
            dues-check.txt
            role-tests.txt
            payment-tests.txt

      - name: Container logs
        if: always()
        working-directory: docker
        run: docker compose logs --tail 80 backend
