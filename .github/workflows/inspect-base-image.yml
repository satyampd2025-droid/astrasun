# Temporary: looks inside the ERPNext base image our server image is built from (layout of the
# built web files, how the image starts), to find why the India Compliance script is missing on
# the running server. Read-only; nothing here touches the live server.
name: Inspect base image

on:
  push:
    branches: [claude/project-thread-z9q9jp]
    paths:
      - ".github/workflows/inspect-base-image.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: frappe/erpnext:v15.121.6
    steps:
      - name: Pull the base image
        run: docker pull "$BASE" | tail -2

      - name: How the image is configured
        run: |
          docker image inspect "$BASE" --format 'User={{.Config.User}} WorkingDir={{.Config.WorkingDir}}'
          docker image inspect "$BASE" --format 'Entrypoint={{json .Config.Entrypoint}}'
          docker image inspect "$BASE" --format 'Cmd={{json .Config.Cmd}}'
          docker image inspect "$BASE" --format 'Volumes={{json .Config.Volumes}}'

      - name: How the image was built (layer commands)
        run: docker history --no-trunc --format '{{.CreatedBy}}' "$BASE" | sed -e 's/  */ /g' | cut -c1-600

      - name: Layout of the built web files in the base image
        run: |
          docker run --rm --entrypoint bash "$BASE" -c '
            cd /home/frappe/frappe-bench
            echo "-- bench dir"; ls -la
            echo "-- sites"; ls -la sites
            echo "-- sites/assets (the entry itself)"; ls -ld sites/assets; readlink -f sites/assets || true
            echo "-- sites/assets (first entries)"; ls -la sites/assets/ 2>&1 | head -20
            echo "-- /home/frappe/frappe-bench/assets (first entries)"; ls -la assets/ 2>&1 | head -20
            echo "-- assets.json files"
            for f in sites/assets/assets.json assets/assets.json; do
              if [ -f "$f" ]; then echo "$f: $(env/bin/python -c "import json,sys;print(len(json.load(open(sys.argv[1]))))" "$f") keys"; else echo "$f: missing"; fi
            done
            echo "-- mounts under the bench"; grep " /home/frappe/frappe-bench" /proc/mounts | cut -d" " -f1-3
          '

      - name: Anything in the image that mentions the assets folder
        run: |
          docker run --rm --entrypoint bash "$BASE" -c '
            echo "-- scripts on PATH that mention assets"
            grep -rIl "assets" /usr/local/bin /usr/bin/nginx-entrypoint.sh /templates 2>/dev/null | head
            echo "-- nginx template: where /assets is served from"
            grep -n -B1 -A4 "assets" /templates/nginx/frappe.conf.template 2>/dev/null | head -30
            echo "-- nginx-entrypoint.sh"
            cat /usr/local/bin/nginx-entrypoint.sh 2>/dev/null | head -60
            echo "-- python code that links or moves the assets folder"
            grep -rn --include=*.py -E "frappe-bench/assets|\"assets\"\)?, *\"assets\"|os\.symlink" /home/frappe/frappe-bench/apps/frappe/frappe/build.py /home/frappe/frappe-bench/env/lib/python3*/site-packages/bench 2>/dev/null | head -20
          '

      - name: Does the symlink come from the image or from running a container?
        run: |
          echo "-- with the image's own entrypoint (what the backend, queue and frontend containers get)"
          docker run --rm "$BASE" bash -c 'ls -ld /home/frappe/frappe-bench/sites/assets; readlink -f /home/frappe/frappe-bench/sites/assets'
          echo "-- same with the entrypoint bypassed"
          docker run --rm --entrypoint bash "$BASE" -c 'ls -ld /home/frappe/frappe-bench/sites/assets; readlink -f /home/frappe/frappe-bench/sites/assets'
