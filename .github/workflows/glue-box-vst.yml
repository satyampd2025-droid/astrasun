name: Build Glue Box VST3

on:
  push:
    paths:
      - "glue-box-vst/**"
      - ".github/workflows/glue-box-vst.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype-dev libfontconfig1-dev

      - name: Configure
        working-directory: glue-box-vst
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: glue-box-vst
        run: cmake --build build --config Release --parallel 4

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: GlueBox-VST3-${{ matrix.name }}
          path: glue-box-vst/build/GlueBox_artefacts/Release/VST3/
