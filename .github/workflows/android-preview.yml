# Builds the phone app on every push and publishes the APK at one fixed link:
# https://github.com/satyampd2025-droid/astrasun/releases/download/app-preview/atulyaa-mill.apk
# A branch can point its build at a server with apps/mobile/build-target.env
# (SERVER_URL=..., RELEASE_TAG=...); the test-server APK goes to the app-test release.
name: Android preview APK

on:
  push:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      - name: Pick server and release
        run: |
          SERVER_URL="${{ vars.MILL_SERVER_URL }}"; RELEASE_TAG=app-preview
          [ -f build-target.env ] && . ./build-target.env
          echo "SERVER_URL=$SERVER_URL" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "Building for ${SERVER_URL:-demo only}, release $RELEASE_TAG"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # One signing key kept in the Actions cache, so each APK installs over the last.
      - name: Restore preview signing key
        id: key
        uses: actions/cache@v4
        with:
          path: apps/mobile/android/app/preview.keystore
          key: preview-keystore-v1

      - name: Create preview signing key
        if: steps.key.outputs.cache-hit != 'true'
        run: >
          keytool -genkeypair -keystore android/app/preview.keystore -alias preview
          -keyalg RSA -keysize 2048 -validity 10000
          -storepass "$PREVIEW_KEYSTORE_PASSWORD" -keypass "$PREVIEW_KEYSTORE_PASSWORD"
          -dname "CN=Atulyaa Mill Preview, O=Astrasun Global LLP, C=IN"
        env:
          PREVIEW_KEYSTORE_PASSWORD: atulyaa-preview

      - name: Build APK
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=SERVER_URL=$SERVER_URL
        env:
          PREVIEW_KEYSTORE_PASSWORD: atulyaa-preview

      - name: Publish to the app-preview release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk atulyaa-mill.apk
          notes="Build ${{ github.run_number }} from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Install on Android: open the link, download, allow installs from this source."
          notes="$notes Server: ${SERVER_URL:-none, demo only}."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" atulyaa-mill.apk --clobber
            gh release edit "$RELEASE_TAG" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" atulyaa-mill.apk --prerelease --title "Phone app ($RELEASE_TAG)" --notes "$notes" --target "$GITHUB_SHA"
          fi
