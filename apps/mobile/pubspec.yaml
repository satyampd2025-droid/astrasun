name: atulyaa_mill
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  printing: ^5.14.2
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Bundled so Hindi renders on every phone and offline. Licence: fonts/OFL.txt
  fonts:
    - family: NotoSans
      fonts:
        - asset: fonts/NotoSans.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: fonts/NotoSansDevanagari.ttf
